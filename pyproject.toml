[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "balance_measurement"
version = "0.0.2"
description = "Python driver for RS-232/USB bench
  scales"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eliott Thommes" },
]
dependencies = [
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "pandas",
    "rich",
    "highlight-text",
    "pyserial",
]
keywords = [
    "matplotlib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Not known :: Not known",
]

[project.optional-dependencies]
rich-text = ["highlight-text"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/Thomeli09/Balance-Measurement"
Repository = "https://github.com/Thomeli09/Balance-Measurement"
Issues = "https://github.com/Thomeli09/Balance-Measurement/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["balance-measurement*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100


