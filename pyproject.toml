[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balance-measurement"
version = "0.3.0"
description = "Typed, extensible RS232 balance acquisition and recording"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "Eliott Thommes"}]
keywords = ["balance", "RS232", "serial", "weighing", "laboratory", "acquisition"]
dependencies = ["pyserial>=3.5,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "mypy>=1.17", "build>=1.2", "types-pyserial>=3.5"]

[project.scripts]
balance-measurement = "balance_measurement.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["balance_measurement*"]

[tool.setuptools.package-data]
balance_measurement = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["hardware: requires an actual connected serial balance"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src/balance_measurement"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["balance_measurement"]
branch = true
